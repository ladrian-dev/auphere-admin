[project]
name = "qa-langgraph-server"
version = "0.1.0"
description = "Nexus QA Playground — LangGraph Server self-hosted, ADR-020 Phase 3"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Auphere" }]
dependencies = [
    # The QA Server reuses the production agent graph (worker package)
    # and the API config + DB layer (api package). Both are path deps
    # editable in dev.
    "nexus-api",
    "nexus-worker",
    "nexus-mcp",
    "nexus-ucm-schema",
    # langgraph-cli's in-memory runtime is enough for dev / Railway —
    # production state lives in the API's Postgres via the worker
    # checkpointer, not in the server's own store.
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.2.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_langgraph_server"]

[tool.uv.sources]
nexus-api = { path = "../api", editable = true }
nexus-worker = { path = "../worker", editable = true }
nexus-mcp = { path = "../mcp", editable = true }
nexus-ucm-schema = { path = "../../packages/ucm-schema/py", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "UP042", "N818"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
files = ["src/qa_langgraph_server"]
