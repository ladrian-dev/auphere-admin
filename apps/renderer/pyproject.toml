[project]
name = "nexus-renderer"
version = "0.1.0"
description = "Nexus fallback page renderer — Chromium behind an address-vetting proxy (spec 047, R59.2, D50)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Auphere" }]
# Licences read and quoted in docs/licenses/renderer.md (constitution §VIII).
# ``playwright`` is pinned EXACTLY: it must match the browsers baked into the
# base image (Dockerfile, mcr.microsoft.com/playwright/python:v1.64.1-noble).
# Bump both together or Chromium is not found at start.
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "playwright==1.64.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff==0.15.12",
    "mypy==2.3.0",
]

[project.scripts]
nexus-renderer = "nexus_renderer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_renderer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "UP042", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Starlette asks for ``httpx2`` in its TestClient; httpx is what the repo uses.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
files = ["src/nexus_renderer"]
