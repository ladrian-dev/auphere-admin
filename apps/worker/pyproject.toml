[project]
name = "nexus-worker"
version = "0.1.0"
description = "Nexus runtime worker — LangGraph agent pipeline + Redis Stream consumer"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Auphere" }]
dependencies = [
    "nexus-api",
    "nexus-mcp",
    "nexus-channels",
    # Phase 2 (ADR-020): UCM v1.0.0 schema + validators + degradation engine.
    # The worker imports it from the ucm_formatter node.
    "nexus-ucm-schema",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "litellm>=1.52.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    # Block H: observability. Langfuse SDK falls back to a noop client
    # when NEXUS_LANGFUSE_PUBLIC_KEY is unset, so dev/test runs do not
    # require live credentials.
    "langfuse>=3.0.0",
    # WP-01 (plataforma v2, Fase 0): the worker now installs OTel tracing
    # (the API package carries the SDK; the exporter ships spans to Grafana
    # Cloud when NEXUS_OTEL_ENABLED=true).
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    # Block N: the multimodal MediaProcessor uses LiteLLM for both
    # Whisper transcription (audio) and Claude Sonnet vision (image,
    # OCR fallback for scanned documents). The API package already
    # carries litellm as a dep but the worker imports it directly
    # for ``atranscription``/``acompletion`` calls.
    "litellm>=1.52.0",
    # Block N: ``S3MediaStorage`` (read path used by the worker's
    # MediaProcessor to fetch bytes for transcription/vision).
    "boto3>=1.34.0",
    # Block N: cheap-path PDF text extraction. Falls back to vision-OCR
    # when missing or when the PDF has no extractable text.
    "pypdf>=4.0.0",
    # Fase B (claude-platform-integration): the Anthropic SDK supplies
    # ``BetaAsyncAbstractMemoryTool`` — the canonical async base class
    # for the Anthropic Memory tool (``memory_20250818``). LiteLLM stays
    # the HTTP client for completions; this dep is used ONLY for the
    # memory tool subclass + its built-in args validation.
    "anthropic>=0.104.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
    "ruff==0.15.12",
    "mypy==2.3.0",
]

[project.scripts]
nexus-worker = "nexus_worker.main:run"
# WP-07 — one console script per service of the v2 map. ``nexus-worker``
# stays as the all-in-one dev/rollback mode.
nexus-runner = "nexus_worker.entrypoints.runner:run"
nexus-scheduler = "nexus_worker.entrypoints.scheduler:run"
nexus-egress = "nexus_worker.entrypoints.egress:run"

[tool.uv.sources]
nexus-api = { path = "../api", editable = true }
nexus-mcp = { path = "../mcp", editable = true }
nexus-channels = { path = "../channels", editable = true }
nexus-ucm-schema = { path = "../../packages/ucm-schema/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "UP042", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast unit tests, no IO",
    "integration: requires Postgres/Redis containers",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
files = ["src/nexus_worker"]
