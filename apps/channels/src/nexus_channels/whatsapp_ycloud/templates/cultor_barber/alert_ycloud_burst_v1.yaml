# Alerta al operador cuando el outbound dispatcher detecta una ráfaga de
# 5xx contra YCloud (>={{1}} fallos en 2 minutos). Disparado por el burst
# tracker (block H) que escribe audit_log "channel.ycloud_5xx_burst".
# Indica problema upstream — chequear status YCloud + Meta cloud API.
name: alert_ycloud_burst_v1
language: es_CL
category: UTILITY
body: |
  Auphere — Cultor Barber: ráfaga de errores YCloud (>={{1}} fallos en 2min). Revisa status YCloud / Meta y el panel de conversaciones.
params:
  - count
