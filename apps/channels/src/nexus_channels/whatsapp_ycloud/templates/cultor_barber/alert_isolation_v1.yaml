# Alerta P1 al operador cuando una garantía de aislamiento dispara métrica.
# Disparado por el isolation_watcher (block H) que lee isolation_events y
# escribe el audit_log row "isolation.violation_detected".
# Cualquier valor > 0 es defecto P1 (ver architecture/agent-isolation.md).
name: alert_isolation_v1
language: es_CL
category: UTILITY
body: |
  Auphere ALERTA P1: violación de aislamiento {{1}} ({{2}} eventos / 1h). Suspender deploys hasta resolver. Revisa el panel y Langfuse.
params:
  - metric_name
  - count
