[project]
name = "nexus-api"
version = "0.1.0"
description = "Nexus FastAPI backend — Auphere agent factory"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Auphere" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "cryptography>=43.0.0",
    "sse-starlette>=2.1.3",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-asyncpg>=0.49b0",
    # WP-01 (plataforma v2, Fase 0): ship spans to Grafana Cloud over
    # OTLP/HTTP. Attached only when NEXUS_OTEL_ENABLED=true.
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    # Block F: webhook layer parses provider payloads via the channel adapter.
    "nexus-channels",
    # Block J: seed_templates loads vertical YAMLs (apps/api/.../seeds/*.yaml).
    "pyyaml>=6.0.2",
    # Block J: TenantCreateIn validates owner_email via Pydantic EmailStr.
    "email-validator>=2.2.0",
    # Block L: Composio v3 SDK is used by ``LiveComposioClient`` for OAuth
    # consent flows and the dynamic catalog. The lazy import in the adapter
    # protects test envs that don't need it, but production needs the
    # package available so ``settings.composio_api_key`` actually picks the
    # Live client instead of silently falling back to the Fake.
    "composio>=0.8.6",
    # Block N: the "Mejorar prompt" utility calls Claude Sonnet 4.6 via
    # LiteLLM. Same provider abstraction the worker uses for the agent
    # runtime, kept synchronous on the API side because the operation is
    # operator-interactive (sub-3s perceived latency expected).
    "litellm>=1.52.0",
    # Block N: WhatsApp media storage. ``boto3`` powers ``S3MediaStorage``
    # (AWS, R2, MinIO) — the webhook downloads inbound media from Meta
    # and the outbound dispatcher presigns S3 URLs the Cloud API fetches.
    # The adapter falls back to in-memory storage in dev/tests when keys
    # are absent, but production always needs the package available.
    "boto3>=1.34.0",
    # Block N: optional document text extraction for inbound PDFs. The
    # MediaProcessor falls back to vision-OCR when ``pypdf`` is missing or
    # fails, so this is technically optional — but installing it keeps
    # the cheap-path (text-PDFs) cheap.
    "pypdf>=4.0.0",
    # ADR-020 Fase 5 closure (2026-05-20): the QA Playground invokes the
    # agent graph IN-PROCESS instead of going through a separate
    # qa-langgraph-server. These three were dev-only before; now they
    # are part of the production runtime of nexus-api.
    "nexus-worker",
    "nexus-mcp",
    "nexus-ucm-schema",
    # langgraph itself is a transitive dep of nexus-worker, but we pin
    # it here so the image build can resolve the version without first
    # resolving the editable worker.
    "langgraph>=1.0.0",
    # ADR-028: widget session JWTs for the partner embed surface
    # (``POST /v1/widget-sessions`` mints, ``/v1/embed/*`` verifies).
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    # respx mocks the httpx transport — used by Meta Embedded Signup tests
    # to stub Graph API without hitting the network.
    "respx>=0.21.1",
    "ruff==0.15.12",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12.20240917",
    # [lua] pulls in ``lupa`` so fakeredis can execute the rate-limit
    # token-bucket Lua script (ADR-028) in tests.
    "fakeredis[lua]>=2.26.0",
    "asgi-lifespan>=2.1.0",
    # Sync Postgres driver used by tests/conftest._ensure_test_db /
    # _reset_test_db when running on CI (no docker exec available there).
    # Binary wheel — no system libpq build required.
    "psycopg2-binary>=2.9.10",
]

[tool.uv.sources]
nexus-worker = { path = "../worker", editable = true }
nexus-mcp = { path = "../mcp", editable = true }
nexus-channels = { path = "../channels", editable = true }
nexus-ucm-schema = { path = "../../packages/ucm-schema/py", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# UP042: str+Enum is intentional — keeps `.value` for Postgres ENUM round-trip while
#        allowing `MyEnum.X == "x"` comparisons in tests/business code.
# N818:  domain errors keep semantic names (TenantNotFound, IsolationViolation, …);
#        the "Error" suffix would add no information.
# B008:  FastAPI's Depends/Query/Path are call expressions in defaults by design.
ignore = ["E501", "B008", "UP042", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"alembic/**" = ["E402", "F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast unit tests, no IO",
    "integration: requires Postgres/Redis containers",
    "isolation: blocking suite — verifies the 7 isolation guarantees",
    "manual_only: release smoke / Browserbase / Meta — opt-in via env vars",
    "slow: tests that take notable wall time; CI still runs them",
    "contract: agent ↔ UCM schema contract tests (Fase 6)",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
ignore_missing_imports = true
disallow_untyped_decorators = false
files = ["src/nexus_api"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*"]
ignore_errors = true
