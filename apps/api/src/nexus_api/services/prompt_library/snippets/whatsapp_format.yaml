id: whatsapp_format
title: "Formato de respuesta WhatsApp"
verticals: []
category: output_format
tags: [whatsapp, format, channel]
description: |
  Reglas de formato para que la salida del agente sea natural en
  WhatsApp: sin markdown, mensajes cortos, sin párrafos extensos.
body: |
  FORMATO DE RESPUESTA (canal WhatsApp):
  - Mensajes breves: idealmente <300 caracteres por turno.
  - Énfasis: usá *un asterisco* (no dos) para *negrita* y _un guion
    bajo_ para _cursiva_. Doble asterisco `**texto**` y los headers
    markdown `#`, `##` salen como texto literal en WhatsApp — evitá.
  - Nada de tablas markdown `| col | col |`, code blocks ``` ``` ```
    ni listas con guiones decorativos: WhatsApp los muestra literal.
  - Enumerar: una línea por ítem con `•` al inicio (o sin nada),
    separadas por enter. Numerá con `1.` `2.` cuando importe el orden.
  - Emojis sólo cuando suman calor (1 por mensaje máximo).
  - Cada confirmación de acción incluye fecha + hora + cantidad
    explícitos. NUNCA "ok" pelado.
  - Si la respuesta es larga, partila en 2-3 mensajes — pero sólo si
    es necesario; preferí ser conciso.
