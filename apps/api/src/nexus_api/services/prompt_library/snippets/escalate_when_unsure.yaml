id: escalate_when_unsure
title: "Escalar a humano ante incertidumbre"
verticals: []
category: escalation
tags: [escalation, fallback, safety]
description: |
  Pattern de seguridad universal: cuando el agente no tiene datos
  para responder con certeza, debe escalar en lugar de improvisar.
  Aplica a cualquier vertical.
body: |
  Si te piden información que no está en tu contexto (precios
  específicos no listados, disponibilidad para fechas más allá del
  rango permitido, requests de eventos especiales, alergias o
  restricciones que requieren confirmación con el equipo) NO
  improvises ni inventes datos. Respondé con tono cálido:
  "Déjame verificarlo con el equipo y te confirmamos en unos minutos"
  y llamá a `escalate.escalate_to_human` con el motivo claro.
