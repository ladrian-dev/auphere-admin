# Spec 031 · R6.4, CE-004 — un reintento nunca manda dos WhatsApp. Vale en es y en. 100 envíos
# con la red cortándose; después, en la base de pruebas, una fila por clave:
#   SELECT idempotency_key, count(*) FROM messages
#    WHERE idempotency_key IS NOT NULL GROUP BY 1 HAVING count(*) > 1;  -- 0 filas
appId: ${APP_ID || "com.auphere.customers.dev"}
---
- launchApp
# Lo primero que pinte: el lanzador de un build de desarrollo, o la app.
- extendedWaitUntil:
    visible: "Development Build|Tu negocio, en el bolsillo|Your business, in your pocket|Hola, .*|Hi, .*"
    timeout: 30000
- runFlow:
    when:
      visible: "Development Build"
    file: _dev-server.yaml
# Directo a la conversación por su enlace (el mismo que abre un aviso).
- openLink: "auphere-customers://inbox/${CONVERSATION_ID}"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000
- repeat:
    times: 100
    commands:
      - tapOn:
          id: "composer-input"
      - inputRandomText
      - toggleAirplaneMode
      - tapOn:
          id: "send"
      - toggleAirplaneMode
      # Si quedó «no enviado», tocarlo reintenta con la misma clave.
      - runFlow:
          when:
            visible: "No se envió. Toca para reintentar.|Not sent. Tap to retry."
          commands:
            - tapOn: "No se envió. Toca para reintentar.|Not sent. Tap to retry."
