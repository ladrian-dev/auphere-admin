<!doctype html>
<!--
  Playground del SDK (@auphere/embed) — E2E local sin partner real.

  Requisitos:
    1. API local:        cd apps/api && uv run uvicorn nexus_api.main:app  (puerto 8000)
    2. App embed local:  cd apps/embed && pnpm dev                         (puerto 3002)
    3. Partner + key + tenant + canal sembrados (ver packages/embed-sdk/playground/seed.md)
    4. Servir ESTA página en un origin permitido de la key:
         cd packages/embed-sdk && python3 -m http.server 5500
       y registrar http://localhost:5500 en allowed_origins de la key.
    5. Backend fake del partner: pegá el session token minteado a mano abajo,
       o dejá que el botón "mint" llame directo a /v1/widget-sessions con la
       secret key (SOLO en local — en producción eso vive en el backend del partner).
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Auphere embed — playground</title>
    <style>
      body { font-family: ui-sans-serif, system-ui; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      label { display: block; font-size: 12px; margin-top: 12px; color: #555; }
      input, textarea { width: 100%; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; }
      button { margin-top: 16px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
      pre { background: #f5f5f5; padding: 12px; font-size: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>@auphere/embed — playground</h1>

    <label>API base
      <input id="api" value="http://localhost:8000" />
    </label>
    <label>Embed origin
      <input id="origin" value="http://localhost:3002" />
    </label>
    <label>Partner slug
      <input id="slug" value="demo" />
    </label>
    <label>Secret API key (solo local — simula el backend del partner; requiere CORS abierto al origin del playground)
      <input id="key" placeholder="ak_live_…" />
    </label>
    <label>Session token (alternativa: mintealo con curl y pegalo — evita CORS; ver seed.md)
      <input id="token" placeholder="eyJ…" />
    </label>
    <label>external_client_ref
      <input id="ref" value="client-1" />
    </label>
    <label>Recipients (JSON)
      <textarea id="recipients" rows="4">[{"phone": "+56911112223", "variables": {"cliente": "Ana", "saldo_pendiente": "$12.000"}}]</textarea>
    </label>

    <button id="open">Abrir broadcast</button>
    <button id="connect">Conectar WhatsApp</button>
    <pre id="log"></pre>

    <script type="module">
      import { createAuphere } from "../dist/index.js";

      const log = (line) => {
        document.getElementById("log").textContent += line + "\n";
      };
      const v = (id) => document.getElementById(id).value.trim();

      function makeClient() {
        return createAuphere({
          partnerSlug: v("slug"),
          embedOrigin: v("origin"),
          // En producción esto pega al backend del partner; acá minteamos
          // directo con la secret key para probar en local — o usamos un
          // token pegado a mano (el mint es server-to-server y CORS lo
          // bloquea desde este origin, correctamente).
          fetchSession: async () => {
            const pasted = v("token");
            if (pasted) {
              log("usando session token pegado");
              return { session_token: pasted, expires_in: 900 };
            }
            const response = await fetch(`${v("api")}/v1/widget-sessions`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${v("key")}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ external_client_ref: v("ref") }),
            });
            if (!response.ok) throw new Error(`mint failed: ${response.status}`);
            const body = await response.json();
            log(`mint ok — whatsapp: ${body.whatsapp?.status}`);
            return body;
          },
        });
      }

      document.getElementById("open").addEventListener("click", async () => {
        const auphere = makeClient();
        try {
          await auphere.openBroadcast({
            recipients: JSON.parse(v("recipients")),
            onDone: (r) => log(`broadcast done: ${JSON.stringify(r)}`),
            onExit: () => log("modal cerrado"),
          });
          log("modal abierto");
        } catch (error) {
          log(`error: ${error.message}`);
        }
      });

      document.getElementById("connect").addEventListener("click", async () => {
        const auphere = makeClient();
        try {
          await auphere.connectWhatsApp({ onExit: () => log("signup cerrado") });
        } catch (error) {
          log(`error: ${error.message}`);
        }
      });
    </script>
  </body>
</html>
