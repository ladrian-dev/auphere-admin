[project]
name = "nexus-ucm-schema"
version = "1.0.0"
description = "Universal Channel Message (UCM) v1.0.0 — schema, validators and degradation engine. See ADR-020."
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Auphere" }]
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucm_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/ucm_schema"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
