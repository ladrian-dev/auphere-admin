services:
  postgres:
    # pgvector pre-built. Apache AGE will be added via custom image (infra/postgres/Dockerfile)
    # once block B starts wiring the KG. For block A only /health is exercised, so DB is
    # available but the API does not connect to it yet.
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nexus-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  api:
    build:
      # Project root context — block F's API depends on apps/channels so
      # the image needs both packages.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api
    environment:
      NEXUS_ENVIRONMENT: dev
      NEXUS_LOG_LEVEL: INFO
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://redis:6379/0
      # LiteLLM bundled cost map — avoids a sync GitHub fetch on the
      # first LLM call.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # LLM provider keys forwarded from the host. The QA Playground
      # invokes the agent graph in-process (ADR-020 Fase 5 closure)
      # so the api container needs them. In Railway these come from
      # the service env vars; the ``${...:-}`` default keeps the file
      # valid when the var is unset locally.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Fernet key for tenant_credentials encryption. Forwarded from the
      # host (inject via ``doppler run``) so api_key connectors seeded with
      # the same key decrypt locally. In Railway this is a service env var.
      NEXUS_FERNET_KEY: ${NEXUS_FERNET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Live-reload mounts; both packages so uvicorn sees source edits.
      - ./apps/api/src:/app/apps/api/src:ro
      - ./apps/channels/src:/app/apps/channels/src:ro
    command:
      [
        "uvicorn", "nexus_api.main:app",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--reload",
        "--reload-dir", "/app/apps/api/src",
        "--reload-dir", "/app/apps/channels/src"
      ]

volumes:
  pgdata:
