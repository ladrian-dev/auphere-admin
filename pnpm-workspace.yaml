# Root pnpm workspace — PLAN-CONSOLE-V1 (CP-01).
#
# Covers the partner console, the operator panel (``apps/admin``, with its
# ``ucm-*`` packages), the desktop app and the shared design system. Since
# spec 031 the panel consumes ``@nexus/ui`` like the console, so it lives in
# this workspace and installs from the single root lockfile.
#
# **No app may keep its own ``pnpm-workspace.yaml``.** pnpm resolves the
# NEAREST one walking up from the cwd, so a leftover file turns that folder
# into a workspace of one that cannot resolve ``workspace:*``. ``apps/desktop``
# had one — it declared no ``packages`` and broke packaging, which only showed
# up in ``pnpm package`` because electron-builder starts with its own
# ``pnpm install`` (``tests/packaging-config.test.ts`` now fails if it comes
# back). ``apps/admin`` and its ``ucm-*`` packages had one each until spec 031.
packages:
  - "apps/admin"
  - "apps/admin/packages/*"
  - "apps/console"
  - "apps/desktop"
  - "packages/ui"
  - "packages/companion-ui"
allowBuilds:
  electron: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - electron
  - esbuild
  - msw
  - sharp
  - unrs-resolver
