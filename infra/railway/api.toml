# Railway service config — nexus-api
#
# Project: auphere-nexus. Service: nexus-api. Root directory: repo root.
# Set this file as the "Config Path" in the Railway service settings:
#   infra/railway/api.toml
#
# The pre-deploy command runs Alembic + Drizzle inside the new revision
# before traffic is shifted. A non-zero exit aborts the cutover so a
# migration failure cannot brick production.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
preDeployCommand = "/app/apps/api/scripts/release.sh"
# Wrap in ``sh -c`` so ``${PORT}`` is shell-expanded at runtime. Railway
# injects ``PORT`` per deployment; the fallback ``:-8000`` keeps the
# Dockerfile's EXPOSE 8000 contract for environments without one.
startCommand = "sh -c 'uvicorn nexus_api.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips=\"*\"'"
healthcheckPath = "/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
