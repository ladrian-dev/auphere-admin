# Railway service config — nexus-egress (WP-07)
#
# Outbound delivery: outbound dispatcher + owner outbox. Replicas
# coordinate via SELECT ... FOR UPDATE SKIP LOCKED — scale freely.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"

[deploy]
startCommand = "nexus-egress"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
