    status: out_of_scope
    label: "Lienzo de nodos para montar el agente"
    note: >-
      No lo habrá. El agente se define con prompt, política, herramientas y
      conocimiento; el lienzo de nodos es una interfaz que el propio mercado
      está retirando. Si lo que hace falta es ver el flujo, mira el
      playground y la traza del turno.
    eta: null
    replaced_by: []

  - key: capability.playground
    family: capability
    status: available
    label: "Playground de pruebas"
    note: "Probar el agente borrador en un hilo de la consola antes de publicar."
    eta: null
    replaced_by: []

  - key: capability.audit_export
    family: capability
    status: available
    label: "Exportación de la auditoría"
    note: "La actividad del partner en CSV, en español o inglés."
    eta: null
    replaced_by: []

  - key: capability.custom_reports
    family: capability
    status: absent
    label: "Informes a medida"
    note: >-
      La consola trae consumo, conversaciones y auditoría con sus filtros.
      Un informe distinto requiere desarrollo.
    eta: null
    replaced_by: []

  - key: capability.client_delete
    family: capability
    status: out_of_scope
    label: "Borrar un cliente desde el Companion"
    note: >-
      El Companion no borra clientes, no toca facturación, no rota ni enseña
      claves de API y no desactiva la revelación de IA. Es una lista cerrada y
      no se amplía. Borrar un cliente se pide a Auphere, con una persona
      delante.
    eta: null
    replaced_by: []

