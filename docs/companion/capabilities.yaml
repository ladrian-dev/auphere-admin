# El documento versionado de capacidades y límites del Companion.
#
# §25.3 de la investigación y §5 de docs/companion/CONTRACT-V2.md.
#
# REGLA DURA: si algo no está en el catálogo leído en este turno, no existe.
# Es R1 aplicada a las capacidades — y por eso este documento se **lee con
# una herramienta** (``console.get_capabilities`` → ``GET /console/capabilities``)
# y no se hornea en el prompt de sistema. Un límite en el prompt no deja
# cita, no deja ``tool.call.started`` y no se puede versionar sin invalidar
# el caché; leerlo deja las tres cosas.
#
# LO MANTENEMOS NOSOTROS. No se infiere del código ni de la base de datos:
# una capacidad inventada es una promesa rota con el cliente de un partner.
# Al editar, sube `version` — es la fecha ISO y es monótona.
#
# `key` vive en el MISMO espacio de nombres que `topic` de los tickets de
# soporte (§4.2), y eso es lo que permite cruzar "qué pidieron" con "qué
# dijimos que había".
#
# Qué autoriza a decir cada `status`:
#   available   → usarlo y afirmarlo
#   planned     → decir que llega, CON `eta`, y ofrecer request_capability
#   absent      → decir que no está y ofrecer request_help / request_capability
#   out_of_scope→ decir que no está Y POR QUÉ, y NO ofrecer ticket de capacidad
#   retired     → decir que se retiró y redirigir a `replaced_by`

version: "2026-08-19"

entries:
  # ── conectores ───────────────────────────────────────────────────────
  # Los cinco `available` son los cinco sembrados de verdad en
  # apps/api/src/nexus_api/services/connectors/seeds/. Leídos del código, no
  # de memoria.
  - key: connector.whatsapp_meta
    family: connector
    status: available
    label: "WhatsApp (Meta)"
    note: "Cloud API de Meta con alta guiada desde la consola. Es el canal principal."
    eta: null
    replaced_by: []

  - key: connector.woocommerce
    family: connector
    status: available
    label: "WooCommerce"
    note: "Catálogo y pedidos de una tienda WooCommerce."
    eta: null
    replaced_by: []

  - key: connector.agendapro
    family: connector
    status: available
    label: "AgendaPro"
    note: "Agenda y reservas para clínicas y centros de servicio."
    eta: null
    replaced_by: []

  - key: connector.amigable_cobro
    family: connector
    status: available
    label: "Amigable Cobro"
    note: "Cobros y enlaces de pago."
    eta: null
    replaced_by: []

  - key: connector.tiktok_bm
    family: connector
    status: out_of_scope
    label: "TikTok (mensajes directos)"
    note: >-
      El backend existe, pero la consola de partners no lo expone (decisión C7
      de PLAN-CONSOLE-V1). Los canales de la consola son WhatsApp y la
      integración por API o MCP. No abras ticket de capacidad por esto: no es
      un hueco, es una decisión.
    eta: null
    replaced_by: []

  - key: connector.shopify
    family: connector
    status: absent
    label: "Shopify"
    note: >-
      No hay conector nativo. Sincronizar pedidos o catálogo requiere
      desarrollo; no hay camino por API pública que lo cubra sin exponer
      credenciales del cliente.
    eta: null
    replaced_by: []

  - key: connector.stripe
    family: connector
    status: planned
    label: "Stripe"
    note: >-
      Cobro y facturación. Está en la hoja de ruta de la plataforma; hoy la
      facturación del partner se lleva fuera de la consola.
    eta: "Fase 2 de la plataforma v2"
    replaced_by: []

  - key: connector.google_calendar
    family: connector
    status: absent
    label: "Google Calendar"
    note: >-
      No hay conector nativo. Para agenda hay AgendaPro; si el cliente usa
      Google Calendar, hoy hace falta desarrollo.
    eta: null
    replaced_by: []

  # ── canales ──────────────────────────────────────────────────────────
  - key: channel.whatsapp
    family: channel
    status: available
    label: "WhatsApp"
    note: >-
      Hasta dos números por cliente. Con más de un canal activo hay que
      etiquetar el rol de cada uno ANTES de conectar el segundo: sin rol
      asignado el envío se rechaza en vez de adivinar.
    eta: null
    replaced_by: []

  - key: channel.tiktok
    family: channel
    status: out_of_scope
    label: "TikTok"
    note: >-
      Fuera del alcance de la consola (C7). Mismo motivo que
      connector.tiktok_bm: el backend está, la consola no lo expone.
    eta: null
    replaced_by: []

  - key: channel.instagram
    family: channel
    status: absent
    label: "Instagram"
    note: "No hay canal de Instagram. Requiere desarrollo y aprobación de Meta."
