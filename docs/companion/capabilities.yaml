  # ── capacidades de la plataforma ─────────────────────────────────────
  - key: capability.embed_widget
    family: capability
    status: retired
    label: "Widget embebido"
    note: >-
      Se retiró (CP-20). La integración de un partner con Auphere es por API
      REST y por MCP; no hay guion que embeber en una página.
    eta: null
    replaced_by: [api, mcp]

  - key: capability.evals_console
    family: capability
    status: planned
    label: "Evaluaciones desde la consola"
    note: >-
      Hoy los conjuntos de evaluación se ejecutan desde el backend, no desde
      la consola. Publicar sin evaluar está permitido y se avisa.
    eta: "Fase 2 de la consola"
    replaced_by: []

  - key: capability.node_canvas
