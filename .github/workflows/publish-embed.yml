# Publish @auphere/embed to the public npm registry (ADR-028).
#
# Trigger: push to `main` that touches packages/embed-sdk/** (or a manual
# run via workflow_dispatch). The job publishes ONLY when the version in
# packages/embed-sdk/package.json is not already on npm — so a normal main
# push is a no-op, and bumping the version is what ships a release. This
# avoids the "republish same version fails" footgun of publish-on-every-push.
#
# Publishes with npm provenance (repo is public + id-token: write covers the
# OIDC attestation; repository.url in package.json MUST match this repo).
#
# Uses npm throughout to match the committed package-lock.json (no pnpm —
# one less third-party action in the supply chain).
#
# Secret required: NPM_TOKEN — a granular access token for the `auphere`
# npm user with read+write on the @auphere scope.
name: publish-embed

on:
  push:
    branches: [main]
    paths:
      - "packages/embed-sdk/**"
      - ".github/workflows/publish-embed.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    defaults:
      run:
        working-directory: packages/embed-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Skip if this version is already published
        id: guard
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@auphere/embed@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@auphere/embed@$PKG_VERSION is already on npm — nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "@auphere/embed@$PKG_VERSION is new — will publish."
          fi

      - if: steps.guard.outputs.already == 'false'
        run: npm ci
      - if: steps.guard.outputs.already == 'false'
        run: npm run typecheck
      - if: steps.guard.outputs.already == 'false'
        run: npm run build

      - name: Publish
        if: steps.guard.outputs.already == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
