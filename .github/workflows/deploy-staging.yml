name: deploy-staging

# WP-25: develop → staging AUTOMÁTICO, tras esperar al workflow ``ci`` del
# MISMO commit en verde. Secuencia: wait-for-ci → build+push imágenes →
# task de migración (BLOQUEANTE: exit != 0 aborta el deploy, mismo contrato
# que el preDeployCommand de Railway) → force-new-deployment de los 4
# servicios.
#
# Trigger directo en push a develop (no workflow_run: ese trigger solo se
# lee de la rama por defecto, y main no deploya nada hasta que exista el
# entorno de producción tras la migración de clientes — decisión de Luis
# 2026-08-09).
#
# Requisitos previos (una vez):
#   - Rol IAM con OIDC de GitHub Actions (bootstrap/github_oidc.tf) —
#     secret AWS_DEPLOY_ROLE_ARN.
#   - Stacks de infra/terraform aplicados en workspace staging (publica los
#     parámetros /nexus/staging/deploy/* que este workflow consume).

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-south-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
      actions: read # wait-for-ci lee los runs del workflow ci

    steps:
      - uses: actions/checkout@v4

      - name: wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # El workflow ci corre en paralelo sobre el mismo push; el deploy
          # no avanza hasta que ese run del MISMO sha esté verde. Timeout
          # 30 min; cualquier conclusión != success aborta el deploy.
          for i in $(seq 1 60); do
            RUN=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "ci")][0] // empty')
            if [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r .status)
              CONCLUSION=$(echo "$RUN" | jq -r .conclusion)
              echo "ci: status=$STATUS conclusion=$CONCLUSION (intento $i)"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCLUSION" = "success" ] && exit 0
                echo "::error::ci terminó en '$CONCLUSION' — deploy abortado."
                exit 1
              fi
            else
              echo "ci: aún sin run para ${{ github.sha }} (intento $i)"
            fi
            sleep 30
          done
          echo "::error::timeout esperando al workflow ci."
          exit 1

      - name: configure aws credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for image in nexus-api nexus-worker; do
            case "$image" in
              nexus-api)    dockerfile=apps/api/Dockerfile ;;
              nexus-worker) dockerfile=apps/worker/Dockerfile ;;
            esac
            docker build -f "$dockerfile" \
              -t "$REGISTRY/$image:$SHA" \
              -t "$REGISTRY/$image:staging" \
              .
            docker push "$REGISTRY/$image:$SHA"
            docker push "$REGISTRY/$image:staging"
          done

      - name: read deploy parameters (SSM)
        id: params
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --name "/nexus/staging/deploy/$1" --query Parameter.Value --output text; }
          {
            echo "cluster=$(get cluster)"
            echo "subnets=$(get private_subnet_ids)"
            echo "migrate_task_def=$(get migrate_task_def)"
            echo "migrate_sg=$(get migrate_sg_id)"
            echo "services=$(get services)"
          } >> "$GITHUB_OUTPUT"

      - name: run migration task (blocking)
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ steps.params.outputs.cluster }}" \
            --task-definition "${{ steps.params.outputs.migrate_task_def }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.params.outputs.subnets }}],securityGroups=[${{ steps.params.outputs.migrate_sg }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "${{ steps.params.outputs.cluster }}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${{ steps.params.outputs.cluster }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`migrate`][0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "${{ steps.params.outputs.cluster }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "migration exit code: $EXIT_CODE ($STOP_REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::La migración falló — deploy ABORTADO. Logs en /nexus/staging/migrate."
            exit 1
          fi

      - name: roll services
        run: |
          set -euo pipefail
          IFS=',' read -ra SERVICES <<< "${{ steps.params.outputs.services }}"
          for svc in "${SERVICES[@]}"; do
            aws ecs update-service \
              --cluster "${{ steps.params.outputs.cluster }}" \
              --service "$svc" --force-new-deployment >/dev/null
            echo "rolling: $svc"
          done
          # services-stable espera a que el circuit breaker decida: si un
          # servicio hace rollback, el wait falla y el run queda rojo.
          aws ecs wait services-stable \
            --cluster "${{ steps.params.outputs.cluster }}" \
            --services "${SERVICES[@]}"
