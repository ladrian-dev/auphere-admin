name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  test-api:
    name: test-api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXUS_ENVIRONMENT: ci
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
      NEXUS_REDIS_URL: redis://localhost:6379/0
      NEXUS_LANGFUSE_PUBLIC_KEY: ""
      NEXUS_LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install uv
        run: pip install uv
      - name: install api + worker + channels + mcp deps
        # ``apps/api[dev]`` pulls in nexus-worker / nexus-mcp / nexus-channels
        # as runtime path deps, but NOT their ``[dev]`` extras. The pytest
        # steps below run inside each package and need their own test-only
        # deps (e.g. respx in channels, fakeredis in mcp). Install all four.
        run: |
          uv pip install --system "./apps/api[dev]"
          uv pip install --system "./apps/worker[dev]"
          uv pip install --system "./apps/channels[dev]"
          uv pip install --system "./apps/mcp[dev]"
      - name: alembic upgrade head (CI database)
        working-directory: apps/api
        run: alembic upgrade head
      - name: pytest — apps/api (unit + isolation + integration)
        working-directory: apps/api
        run: pytest -x --tb=short
      - name: pytest — apps/channels
        working-directory: apps/channels
        run: pytest -x --tb=short
      - name: pytest — apps/mcp
        working-directory: apps/mcp
        run: pytest -x --tb=short

  test-admin:
    name: test-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      - name: install
        working-directory: apps/admin
        run: pnpm install --frozen-lockfile
      # The admin app consumes @nexus/ucm-schema, @nexus/ucm-render-web and
      # @nexus/ucm-preview-whatsapp as ``file:../../packages/...`` deps. Each
      # package ships from its ``dist/`` (``main``/``types`` in package.json).
      # ``dist/`` is gitignored, so we have to build the three of them BEFORE
      # tsc runs — otherwise typecheck fails with TS2307 on the @nexus/* imports.
      # See ADR-021 and features/qa-playground-streaming-implementation Fase 0.
      - name: "build local @nexus/ucm-* packages (file: deps need dist/)"
        # Each package gets its own subshell so the cwd resets — chained
        # ``cd`` would compound relative paths and the third hop lands
        # outside packages/. Paths are absolute from $GITHUB_WORKSPACE.
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE/packages/ucm-schema/ts" && pnpm install --frozen-lockfile --ignore-scripts && pnpm build)
          (cd "$GITHUB_WORKSPACE/packages/ucm-render-web" && pnpm install --frozen-lockfile --ignore-scripts && pnpm build)
          (cd "$GITHUB_WORKSPACE/packages/ucm-preview-whatsapp" && pnpm install --frozen-lockfile --ignore-scripts && pnpm build)
      - name: typecheck
        working-directory: apps/admin
        run: pnpm typecheck
      - name: lint
        working-directory: apps/admin
        run: pnpm lint
      - name: vitest
        working-directory: apps/admin
        run: pnpm test
      - name: next build
        working-directory: apps/admin
        env:
          NEXUS_BACKEND_URL: http://localhost:8000
          NEXUS_ADMIN_TOKEN: ci-token
          BETTER_AUTH_SECRET: ci-secret-32-chars-padding-padding-padding
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
          NEXUS_ADMIN_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
        run: pnpm build

  # ADR-017 / migration 0021 — the AgendaPro admin browser MCP (Node
  # subprocess) was removed. The ``test-mcp-node`` job that built +
  # tested it is gone with it. When the new public-link MCP lands a
  # replacement job will live here.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install uv
        run: pip install uv
      - name: install api + worker + mcp + channels (for mypy/ruff)
        run: |
          uv pip install --system "./apps/api[dev]"
          uv pip install --system "./apps/worker[dev]"
          uv pip install --system "./apps/mcp[dev]"
          uv pip install --system "./apps/channels[dev]"
      - name: ruff check
        run: |
          ruff check apps/api/src apps/api/tests
          ruff check apps/worker/src apps/worker/tests
          ruff check apps/channels/src apps/channels/tests
          ruff check apps/mcp/src apps/mcp/tests
      - name: ruff format --check
        run: |
          ruff format --check apps/api/src apps/api/tests
          ruff format --check apps/worker/src apps/worker/tests
          ruff format --check apps/channels/src apps/channels/tests
          ruff format --check apps/mcp/src apps/mcp/tests
      # Each mypy run uses ``working-directory`` so mypy discovers the
      # ``[tool.mypy]`` config in that package's own pyproject.toml. Running
      # ``mypy apps/api/src/nexus_api`` from the repo root walks up from the
      # CWD (root) looking for a config and never finds one — losing the
      # ``ignore_missing_imports = true`` setting and producing false-positive
      # "Skipping analyzing nexus_channels" / "Cannot find composio" errors.
      - name: mypy --strict (api)
        working-directory: apps/api
        run: mypy --strict src/nexus_api
      - name: mypy --strict (worker)
        working-directory: apps/worker
        run: mypy --strict src/nexus_worker
      - name: mypy --strict (channels)
        working-directory: apps/channels
        run: mypy --strict src/nexus_channels
      - name: mypy --strict (mcp)
        working-directory: apps/mcp
        run: mypy --strict src/nexus_mcp
