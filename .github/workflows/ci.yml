name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  test-api:
    name: test-api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXUS_ENVIRONMENT: ci
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
      NEXUS_REDIS_URL: redis://localhost:6379/0
      NEXUS_LANGFUSE_PUBLIC_KEY: ""
      NEXUS_LANGFUSE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install uv
        run: pip install uv
      - name: install api + worker + channels + mcp deps (desde uv.lock)
        # Los cuatro paquetes: ``apps/api[dev]`` arrastra worker / mcp /
        # channels como dependencias de ruta, pero NO sus extras ``[dev]``,
        # y los pytest de abajo corren dentro de cada paquete con sus
        # dependencias de test propias (respx en channels, fakeredis en mcp).
        #
        # Se instala desde el LOCK, no resolviendo de cero. Resolver en cada
        # run hacía que CI corriese con versiones distintas de las locales:
        # así llegaron mypy 2.3 y redis 8.1 sin que nadie los pidiera, con
        # una tarde de CI en rojo detrás. ``--frozen`` falla si el lock no
        # concuerda con el pyproject, que es justo la señal que queremos.
        #
        # El export se hace DENTRO de cada paquete a propósito: las
        # dependencias de ruta salen como rutas relativas (``-e ../worker``)
        # y solo resuelven desde ahí.
        run: |
          set -euo pipefail
          for pkg in api worker channels mcp; do
            ( cd "apps/$pkg" \
              && uv export --frozen --extra dev --no-emit-project --no-hashes \
                   > "/tmp/ci-$pkg-requirements.txt" \
              && uv pip install --system -r "/tmp/ci-$pkg-requirements.txt" )
          done
          uv pip install --system --no-deps \
            ./apps/api ./apps/worker ./apps/channels ./apps/mcp
      - name: alembic upgrade head (CI database)
        working-directory: apps/api
        run: alembic upgrade head
      - name: pytest — apps/api (unit + isolation + integration)
        working-directory: apps/api
        run: pytest -x --tb=short
      # CO-07. Corre por segunda vez a propósito: el paso de arriba es la
      # barrera (ya rompe el build), y este deja el reparto del dataset y
      # los dos números de R1 —falsos positivos y recall— en su propio
      # bloque de salida. Sin él la cifra del §17 queda enterrada en un log
      # de 1.500 líneas, que es como una métrica deja de mirarse. El modo
      # live NO se enciende aquí: depende de un proveedor externo, y un
      # rojo por un incidente ajeno enseña al equipo a ignorar los rojos.
      - name: "companion — evals CO-07 (gate R1 · R2 · §6.5)"
        working-directory: apps/api
        run: python scripts/companion_evals.py
      - name: pytest — apps/worker
        # Faltaba: el paquete tiene 351 tests y ninguno corría en CI, así que
        # una regresión suya (retry del consumer, 2026-08) pasó desapercibida.
        working-directory: apps/worker
        run: pytest tests/unit -x --tb=short
      - name: pytest — apps/channels
        working-directory: apps/channels
        run: pytest -x --tb=short
      - name: pytest — apps/mcp
        working-directory: apps/mcp
        run: pytest -x --tb=short

  test-admin:
    name: test-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      # Since the TS packages moved into apps/admin/packages/ as a
      # pnpm workspace, ``pnpm install`` sets up symlinks and the
      # admin's ``pretypecheck`` / ``prebuild`` / ``pretest`` hooks
      # build the packages on demand. No explicit pre-install build
      # step needed anymore.
      - name: install
        working-directory: apps/admin
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/admin
        run: pnpm typecheck
      - name: lint
        working-directory: apps/admin
        run: pnpm lint
      - name: vitest
        working-directory: apps/admin
        run: pnpm test
      # ADR-034: el panel perdió Better Auth y Drizzle. Este grep es lo que
      # impide que vuelva a coger una dependencia de Postgres sin querer —
      # que es exactamente como llegó el 500 del 2026-08-19.
      - name: "admin — no database, ever"
        working-directory: apps/admin
        run: pnpm check:no-database
      - name: next build
        working-directory: apps/admin
        env:
          NEXUS_BACKEND_URL: http://localhost:8000
          NEXUS_ADMIN_TOKEN: ci-token
        run: pnpm build

  # PLAN-CONSOLE-V1 (CP-01/CP-03): the shared design system and the partner
  # console live in the ROOT pnpm workspace (apps/admin keeps its own).
  # The design-system lint (hex / spacing scale / radius enum), the
  # component tests, the console's tests and the "no admin token" grep all
  # block here.
  test-console:
    name: test-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: install (root workspace)
        run: pnpm install --frozen-lockfile
      - name: "@nexus/ui — typecheck + lint + test"
        working-directory: packages/ui
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: "@nexus/ui — storybook builds (one story per state)"
        working-directory: packages/ui
        run: pnpm build-storybook --quiet
      - name: "console — no static admin token, ever"
        working-directory: apps/console
        run: pnpm check:no-admin-token
      - name: "console — typecheck + lint + test"
        working-directory: apps/console
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: "console — next build"
        working-directory: apps/console
        env:
          NEXUS_BACKEND_URL: http://localhost:8000
          NEXUS_CONSOLE_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
          NEXUS_CONSOLE_JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMC4CAQAwBQYDK2VwBCIEIGVs4kJmY0k7pS8YkK9uWJ2fJx3v9x2h6h1oQ0v0K5m3\n-----END PRIVATE KEY-----"
          BETTER_AUTH_SECRET: ci-secret-32-chars-padding-padding-padding
          BETTER_AUTH_URL: http://localhost:3110
        run: pnpm build

  # ADR-017 / migration 0021 — the AgendaPro admin browser MCP (Node
  # subprocess) was removed. The ``test-mcp-node`` job that built +
  # tested it is gone with it. When the new public-link MCP lands a
  # replacement job will live here.

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install uv
        run: pip install uv
      - name: install api + worker + mcp + channels (desde uv.lock, para mypy/ruff)
        # Mismo motivo que en test-api: es precisamente aquí donde la
        # resolución fresca dolía — mypy y ruff cambiando de versión bajo
        # los pies ponen en rojo un código que no ha tocado nadie.
        run: |
          set -euo pipefail
          for pkg in api worker channels mcp; do
            ( cd "apps/$pkg" \
              && uv export --frozen --extra dev --no-emit-project --no-hashes \
                   > "/tmp/lint-$pkg-requirements.txt" \
              && uv pip install --system -r "/tmp/lint-$pkg-requirements.txt" )
          done
          uv pip install --system --no-deps \
            ./apps/api ./apps/worker ./apps/channels ./apps/mcp
      - name: ruff check
        run: |
          ruff check apps/api/src apps/api/tests
          ruff check apps/worker/src apps/worker/tests
          ruff check apps/channels/src apps/channels/tests
          ruff check apps/mcp/src apps/mcp/tests
      - name: ruff format --check
        run: |
          ruff format --check apps/api/src apps/api/tests
          ruff format --check apps/worker/src apps/worker/tests
          ruff format --check apps/channels/src apps/channels/tests
          ruff format --check apps/mcp/src apps/mcp/tests
      # Each mypy run uses ``working-directory`` so mypy discovers the
      # ``[tool.mypy]`` config in that package's own pyproject.toml. Running
      # ``mypy apps/api/src/nexus_api`` from the repo root walks up from the
      # CWD (root) looking for a config and never finds one — losing the
      # ``ignore_missing_imports = true`` setting and producing false-positive
      # "Skipping analyzing nexus_channels" / "Cannot find composio" errors.
      - name: mypy --strict (api)
        working-directory: apps/api
        run: mypy --strict src/nexus_api
      - name: mypy --strict (worker)
        working-directory: apps/worker
        run: mypy --strict src/nexus_worker
      - name: mypy --strict (channels)
        working-directory: apps/channels
        run: mypy --strict src/nexus_channels
      - name: mypy --strict (mcp)
        working-directory: apps/mcp
        run: mypy --strict src/nexus_mcp

  # WP-23/25: la infraestructura también tiene tests que bloquean — fmt y
  # validate de cada stack (sin backend: no toca AWS ni el estado).
  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff
      - name: terraform validate (todos los stacks)
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          for stack in bootstrap 00-network 10-data 20-services 30-observability; do
            echo "== $stack =="
            terraform -chdir="$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="$stack" validate
          done
