name: deploy-grafana

# WP-30b — construye la imagen propia de Grafana (upstream + el
# aprovisionamiento horneado) y rueda el servicio.
#
# Workflow SEPARADO de deploy-staging a propósito: cambiar un panel no
# debe esperar a la suite entera de la app ni disparar una migración, y un
# despliegue de la app no debe reconstruir Grafana. Se dispara sólo cuando
# cambia lo que va dentro de la imagen.
#
# La imagen es arm64 (Fargate ARM es ~20-25% más barato en eu-south-2) y
# el runner es x86, así que hace falta QEMU + buildx. Sale barato porque
# la imagen son dos COPY sobre la de upstream: no se compila nada.

on:
  push:
    branches: [develop]
    paths:
      - "infra/grafana/**"
      - ".github/workflows/deploy-grafana.yml"
  workflow_dispatch:

concurrency:
  group: deploy-grafana
  cancel-in-progress: false

env:
  AWS_REGION: eu-south-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Los paneles se despliegan sin que nadie los abra: un JSON mal
      # formado se descubriría como un panel vacío en la UI, no como un
      # build rojo. Esto lo convierte en build rojo.
      - name: validar los paneles
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in infra/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok: $f"
            found=1
          done
          if [ "$found" = 0 ]; then
            echo "::error::no hay ningún panel en infra/grafana/dashboards/"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: configure aws credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            -f infra/grafana/Dockerfile \
            -t "$REGISTRY/nexus-grafana:$SHA" \
            -t "$REGISTRY/nexus-grafana:staging" \
            --push \
            infra/grafana

      # El servicio puede no existir todavía (grafana_enabled=false por
      # defecto en 30-observability). Empujar la imagen y no rodar nada es
      # un resultado válido; fallar aquí no aportaría nada.
      - name: roll grafana si el servicio existe
        run: |
          set -euo pipefail
          CLUSTER=$(aws ssm get-parameter --name /nexus/staging/deploy/cluster \
            --query Parameter.Value --output text)
          SVC="nexus-staging-grafana"
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SVC" \
            --query 'services[0].status' --output text 2>/dev/null || echo "None")
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::notice::$SVC no está activo (status=$STATUS) — imagen empujada, sin rollout."
            exit 0
          fi
          aws ecs update-service --cluster "$CLUSTER" --service "$SVC" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SVC"
          echo "grafana desplegado"
